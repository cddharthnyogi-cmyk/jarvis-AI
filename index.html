<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
    <title>J.A.R.V.I.S. Advanced AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #020813; color: #00f0ff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px; text-align: center; }
        
        .header h1 { font-size: 26px; letter-spacing: 5px; text-shadow: 0 0 15px #00f0ff; margin-top: 5px; }
        .status { font-size: 11px; color: #00ffaa; margin-top: 5px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }

        .orb-container { position: relative; width: 170px; height: 170px; display: flex; justify-content: center; align-items: center; margin: 15px 0; }
        .outer-ring { position: absolute; width: 100%; height: 100%; border: 3px dashed #00f0ff; border-radius: 50%; animation: rotate 12s linear infinite; box-shadow: 0 0 25px rgba(0, 240, 255, 0.4); }
        .inner-core { width: 90px; height: 90px; background: radial-gradient(circle, #00f0ff 0%, #003355 70%, transparent 100%); border-radius: 50%; box-shadow: 0 0 35px #00f0ff; animation: pulse 2s infinite alternate; }
        
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 20px #00f0ff; } 100% { transform: scale(1.05); box-shadow: 0 0 45px #00f0ff; } }

        .response-box { width: 100%; max-width: 360px; height: 130px; background: rgba(0, 15, 30, 0.85); border: 1px solid #00f0ff; border-radius: 12px; padding: 12px; overflow-y: auto; color: #e0ffff; font-size: 13px; text-align: left; box-shadow: inset 0 0 12px rgba(0,240,255,0.25); }

        .controls { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .text-input { background: rgba(0,0,0,0.7); border: 1px solid #004466; color: #00f0ff; padding: 11px; border-radius: 8px; font-size: 13px; outline: none; }
        .text-input::placeholder { color: #005577; }
        
        .btn-group { display: flex; gap: 6px; }
        .action-btn { flex: 1; background: #00f0ff; color: #020813; border: none; padding: 12px 8px; border-radius: 20px; font-weight: bold; font-size: 12px; cursor: pointer; box-shadow: 0 0 12px #00f0ff; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; }
        .action-btn:active { transform: scale(0.96); }
        .wake-btn { background: #ffaa00; box-shadow: 0 0 12px #ffaa00; color: #020813; }
    </style>
</head>
<body>

    <div class="header">
        <h1>J.A.R.V.I.S.</h1>
        <div class="status" id="status">SYSTEM STANDBY</div>
    </div>

    <div class="orb-container">
        <div class="outer-ring"></div>
        <div class="inner-core" id="orb"></div>
    </div>

    <div class="response-box" id="responseBox">
        Sir, systems online. Click 'Hands-Free Mode' to enable wake word or type a command.
    </div>

    <div class="controls">
        <input type="text" id="userText" class="text-input" placeholder="Type command...">
        <div class="btn-group">
            <button class="action-btn wake-btn" onclick="toggleWakeWord()">🎙️ Hands-Free</button>
            <button class="action-btn" onclick="processCommand()">Send / Speak</button>
        </div>
    </div>

    <script>
        const responseBox = document.getElementById('responseBox');
        const statusText = document.getElementById('status');
        const userTextInput = document.getElementById('userText');
        const apiKey = "AQ.Ab8RN6I3Rkq4JJHTxYbnobzOclPH_HowHxtBNU5jGRjrQcwbNA"; // API Key

        let recognition = null;
        let isHandsFreeActive = false;

        // Initialize Speech Recognition
        function initRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition not supported in this browser. Use Chrome.");
                return null;
            }
            const rec = new SpeechRecognition();
            rec.continuous = true;
            rec.interimResults = false;
            rec.lang = 'en-US';
            return rec;
        }

        // Toggle Hands-Free Wake Word Mode
        function toggleWakeWord() {
            if (isHandsFreeActive) {
                if (recognition) recognition.stop();
                isHandsFreeActive = false;
                statusText.innerText = "SYSTEM STANDBY";
                responseBox.innerText = "Hands-Free mode deactivated.";
                return;
            }

            recognition = initRecognition();
            if (!recognition) return;

            recognition.onstart = () => {
                isHandsFreeActive = true;
                statusText.innerText = "LISTENING FOR 'JARVIS'...";
                responseBox.innerText = "Hands-Free active. Say 'Hey Jarvis' followed by your command.";
                speakOut("Hands-free mode activated, sir.");
            };

            recognition.onresult = (event) => {
                const speechResult = event.results[event.results.length - 1][0].transcript.toLowerCase();
                console.log("Heard:", speechResult);

                if (speechResult.includes('jarvis')) {
                    statusText.innerText = "JARVIS AWAKE...";
                    
                    // Clean up wake word to isolate the command
                    let command = speechResult.replace('hey jarvis', '').replace('jarvis', '').trim();
                    
                    if (command.length > 2) {
                        userTextInput.value = command;
                        sendToGemini(command);
                    } else {
                        speakOut("Yes Sir?");
                        responseBox.innerText = "Sir? I'm listening for your command...";
                    }
                }
            };

            recognition.onerror = (event) => {
                console.log("Mic error:", event.error);
            };

            recognition.onend = () => {
                // Auto restart to keep listening continuously in hands-free mode
                if (isHandsFreeActive) {
                    try { recognition.start(); } catch (e) { console.log(e); }
                }
            };

            try {
                recognition.start();
            } catch (e) {
                console.log("Start error:", e);
            }
        }

        // Standard Button / Text Command Processing
        function processCommand() {
            let text = userTextInput.value.trim();
            if (!text) {
                // Quick single-shot voice prompt if text box is empty and Hands-Free is off
                const singleRec = initRecognition();
                if (!singleRec) return;
                singleRec.continuous = false;
                singleRec.onstart = () => { statusText.innerText = "LISTENING..."; };
                singleRec.onresult = (event) => {
                    text = event.results[0][0].transcript;
                    userTextInput.value = text;
                    sendToGemini(text);
                };
                singleRec.onerror = () => {
                    statusText.innerText = "ONLINE";
                    responseBox.innerText = "Voice error. Please type your command.";
                };
                singleRec.start();
                return;
            }
            sendToGemini(text);
        }

        // Send Request to Gemini 3.6 Flash API
        async function sendToGemini(promptText) {
            statusText.innerText = "THINKING...";
            responseBox.innerText = `You: ${promptText}\n\nJarvis: Processing...`;

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `You are JARVIS, Tony Stark's AI assistant. Keep your response concise (2 sentences max) and professional. User: ${promptText}` }] }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    responseBox.innerText = aiReply;
                    statusText.innerText = isHandsFreeActive ? "LISTENING FOR 'JARVIS'..." : "SYSTEM ONLINE";
                    speakOut(aiReply);
                } else if (data.error) {
                    responseBox.innerText = `API Error: ${data.error.message}`;
                    statusText.innerText = "ERROR";
                } else {
                    responseBox.innerText = "API Error: Unexpected response structure.";
                    statusText.innerText = "ERROR";
                }

            } catch (err) {
                responseBox.innerText = "Network Error. Check internet connection.";
                statusText.innerText = "ERROR";
            }
        }

        // Text-to-Speech Voice Output
        function speakOut(message) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(message);
                utterance.pitch = 0.85; // Deeper futuristic tone
                utterance.rate = 1.05;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
