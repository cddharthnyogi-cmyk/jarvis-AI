<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS AI</title>
<style>
body{background:#020617;color:white;font-family:Arial;text-align:center;margin:0;padding:20px}
#orb{width:120px;height:120px;background:radial-gradient(#38bdf8,#0ea5e9);border-radius:50%;margin:40px auto;box-shadow:0 0 40px #38bdf8;animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
#chat{max-width:400px;margin:auto;text-align:left;background:#0f172a;padding:15px;border-radius:12px;min-height:200px;max-height:50vh;overflow-y:auto}
input{width:70%;padding:12px;border-radius:20px;border:none;outline:none}
button{padding:12px 18px;border-radius:20px;border:none;background:#38bdf8;color:black;font-weight:bold}
.key-box{margin:15px auto;font-size:12px;opacity:0.7}
</style>
</head>
<body>

<div id="orb"></div>
<h2>JARVIS is Online</h2>

<div id="chat"></div>

<br>
<input id="prompt" placeholder="Ask anything...">
<button onclick="ask()">Send</button>
<button onclick="startVoice()">🎤 Speak</button>

<div class="key-box">
<p id="keyStatus"></p>
<button onclick="changeKey()" style="font-size:10px;padding:5px">Change API Key</button>
</div>

<script>
// --- KEY SYSTEM ---
let apiKey = localStorage.getItem("jarvis_key");
if(!apiKey){
  apiKey = prompt("Apni AQ... wali Gemini API Key daalo:");
  if(apiKey) localStorage.setItem("jarvis_key", apiKey);
}
document.getElementById("keyStatus").innerText = apiKey? "Key Saved: " + apiKey.slice(0,8) + "..." : "No Key";

function changeKey(){
  let k = prompt("Nayi API Key daalo:", apiKey || "");
  if(k){ localStorage.setItem("jarvis_key", k); location.reload(); }
}

// --- CHAT ---
async function ask(){
  const input = document.getElementById("prompt");
  const text = input.value;
  if(!text) return;
  addMsg("You: " + text);
  input.value = "";

  const reply = await callGemini(text);
  addMsg("JARVIS: " + reply);
  speak(reply);
}

function addMsg(m){
  const c = document.getElementById("chat");
  c.innerHTML += "<p>"+m+"</p>";
  c.scrollTop = c.scrollHeight;
}

// --- MAIN GEMINI CALL - FIXED FOR AQ KEY ---
async function callGemini(prompt){
  apiKey = localStorage.getItem("jarvis_key");
  if(!apiKey) return "API Key nahi hai! Change API Key pe click karo.";

  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }]
      })
    });

    const data = await res.json();
    console.log(data);

    if(data.error){
      return "Error: " + data.error.message + " (Key check karo)";
    }
    return data.candidates?.[0]?.content?.parts?.[0]?.text || "No reply";

  } catch(e){
    return "Network Error: " + e.message;
  }
}

// --- VOICE ---
function speak(text){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  speechSynthesis.speak(u);
}

function startVoice(){
  const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.lang = "en-US";
  rec.start();
  rec.onresult = (e) => {
    document.getElementById("prompt").value = e.results[0][0].transcript;
    ask();
  }
}
</script>

</body>
</html>
