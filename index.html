<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS FIXED</title>
</head>
<body style="background:#02111f;color:#0ff;font-family:monospace;padding:20px;text-align:center">
<h3>JARVIS FIXED TEST</h3>
<div id="out" style="border:1px solid #0ff;padding:15px;border-radius:10px;min-height:100px;text-align:left"></div>
<br><input id="inp" style="width:70%;padding:10px"><button onclick="go()" style="padding:10px">SEND</button>
<script>
const API_KEY = "AQ.Ab8RN6I-fAIPB-mr1RVwp4xV1cB0QYQp_xxx_TUMHARI_PURI_KEY_YAHAN_PASTE_KARO";
async function go(){
  const q = document.getElementById('inp').value;
  const out = document.getElementById('out');
  out.innerHTML = "Thinking...";
  const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + API_KEY;
  const res = await fetch(url, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({contents:[{parts:[{text:q}]}]})
  });
  const data = await res.json();
  console.log(data);
  if(data.error){ out.innerHTML = "ERROR: " + data.error.message; }
  else { out.innerHTML = data.candidates[0].content.parts[0].text; }
}
</script>
</body>
